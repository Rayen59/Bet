services:
  - type: web
    name: sportzone-platform
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: NODE_ENV=production node server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SQL_HOST
        sync: false
      - key: SQL_PORT
        value: "5432"
      - key: SQL_USER
        sync: false
      - key: SQL_PASSWORD
        sync: false
      - key: SQL_DB_NAME
        sync: false
      - key: SQL_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
